    function calculateProjectEstimate(state) {
      const scopeObj = SCOPE_OPTIONS.find((o) => o.key === state.scope) || SCOPE_OPTIONS[0];
      const dataObj = DATA_OPTIONS.find((o) => o.key === state.data) || DATA_OPTIONS[0];
      const deployObj = DEPLOY_OPTIONS.find((o) => o.key === state.deploy) || DEPLOY_OPTIONS[0];
      const velocityObj = VELOCITY_OPTIONS.find((o) => o.key === state.velocity) || VELOCITY_OPTIONS[0];

      const baseCost = scopeObj.cost + dataObj.cost + deployObj.cost;
      const minCost = Math.round(baseCost * velocityObj.mult);
      const maxCost = Math.round(minCost * 1.35);

      const rawWeeks = (scopeObj.weeks + dataObj.weeks + deployObj.weeks) * velocityObj.timeMult;
      const totalWeeksMin = Math.max(2, Math.round(rawWeeks));
      const totalWeeksMax = totalWeeksMin + 2;
      const timelinePercent = Math.min(100, Math.max(20, Math.round((totalWeeksMin / 14) * 100)));

      return {
        minCost,
        maxCost,
        formattedMinCost: `$${minCost.toLocaleString()}`,
        formattedMaxCost: `$${maxCost.toLocaleString()}`,
        totalWeeksMin,
        totalWeeksMax,
        timelineLabel: `${totalWeeksMin} – ${totalWeeksMax} Weeks`,
        timelinePercent,
        squadText: SQUAD_DEFINITIONS[state.scope] || SQUAD_DEFINITIONS.custom_ai,
        scopeLabel: scopeObj.label,
        dataLabel: dataObj.label,
        deployLabel: deployObj.label,
        velocityLabel: velocityObj.label
      };
    }

    function isValidEmail(email) {
      if (!email || typeof email !== 'string') return false;
      const trimmed = email.trim();
      const emailRegex = /^[a-zA-Z0-9.!#$%&'*+/=?^_`{|}~-]+@[a-zA-Z0-9](?:[a-zA-Z0-9-]{0,61}[a-zA-Z0-9])?(?:\.[a-zA-Z0-9](?:[a-zA-Z0-9-]{0,61}[a-zA-Z0-9])?)+$/;
      return emailRegex.test(trimmed);
    }

    function validateEstimatorForm(data) {
      const errors = {};
      if (!data.email || !data.email.trim()) {
        errors.email = 'Corporate email is required';
      } else if (!isValidEmail(data.email)) {
        errors.email = 'Please provide a valid corporate email address (e.g. name@company.com)';
      }
      if (!data.company || data.company.trim().length < 2) {
        errors.company = 'Company entity name is required (min 2 characters)';
      }
      return {
        isValid: Object.keys(errors).length === 0,
        errors
      };
    }

    function validateStrategyBookingForm(data) {
      const errors = {};
      if (!data.fullName || data.fullName.trim().length < 2) {
        errors.fullName = 'Full name is required (min 2 characters)';
      }
      if (!data.corporateEmail || !data.corporateEmail.trim()) {
        errors.corporateEmail = 'Corporate email is required';
      } else if (!isValidEmail(data.corporateEmail)) {
        errors.corporateEmail = 'Please provide a valid corporate email address';
      }
      if (!data.projectType || data.projectType.trim() === '') {
        errors.projectType = 'Please select a project type architecture';
      }
      if (!data.projectDetails || data.projectDetails.trim().length < 10) {
        errors.projectDetails = 'Please provide technical specifications or current blockers (min 10 characters)';
      }
      if (!data.ndaAccepted) {
        errors.ndaAccepted = 'You must confirm the confidentiality agreement';
      }
      return {
        isValid: Object.keys(errors).length === 0,
        errors
      };
    }

                <span>REC // ARCH_2025</span>
              </div>
            </div>

            <div className="p-4 bg-surface-container-lowest border-t border-surface-container-high flex flex-col gap-3">
              <div className="flex items-center gap-3">
                <span className="font-mono text-xs text-outline">
                  {Math.floor((progress * 1.2) / 60)}:{(Math.floor(progress * 1.2) % 60).toString().padStart(2, '0')}
                </span>
                <div
                  className="flex-1 h-2 bg-surface-container-high rounded-full overflow-hidden cursor-pointer relative"
                  onClick={(e) => {
                    const rect = e.currentTarget.getBoundingClientRect();
                    const clickX = e.clientX - rect.left;
                    const newProgress = Math.round((clickX / rect.width) * 100);
                    setProgress(Math.max(0, Math.min(100, newProgress)));
                  }}
                >
                  <div
                    className="h-full bg-gradient-to-r from-primary-container via-primary to-secondary transition-all"
                    style={{ width: `${progress}%` }}
                  ></div>
                </div>
                <span className="font-mono text-xs text-outline">02:00</span>
              </div>

              <div className="flex items-center justify-between gap-4">
                <div className="flex items-center gap-2">
                  <button
                    type="button"
                    onClick={() => setIsPlaying(!isPlaying)}
                    className="w-9 h-9 rounded-lg bg-primary-container text-on-primary-container flex items-center justify-center font-bold hover:shadow-[0_0_15px_rgba(0,240,255,0.4)] transition-all cursor-pointer"
                    aria-label={isPlaying ? 'Pause' : 'Play'}
                  >
                    <span className="material-symbols-outlined text-[20px]">
                      {isPlaying ? 'pause' : 'play_arrow'}
                    </span>
                  </button>

                  <div className="hidden sm:flex items-center gap-1.5 ml-2">
                    {chapters.map((ch) => (
                      <button
                        key={ch.num}
                        type="button"
                        onClick={() => {
                          setActiveChapter(ch.num);
                          setProgress((ch.num - 1) * 33 + 5);
                        }}
                        className={`px-3 py-1 rounded text-xs font-mono transition-all cursor-pointer ${
                          activeChapter === ch.num
                            ? 'bg-surface-container-high text-primary-container border border-primary-container/40'
                            : 'bg-surface-container text-on-surface-variant hover:text-on-surface'
                        }`}
                      >
                        0{ch.num}
                      </button>
                    ))}
                  </div>
                </div>

                <button
                  onClick={onClose}
                  className="px-4 py-2 rounded-lg bg-surface-container hover:bg-surface-container-high text-on-surface text-xs font-semibold cursor-pointer border border-outline-variant/30"
                >
                  Done Watching
                </button>
              </div>
            </div>
          </div>
        </div>
      );
    }

    // ==========================================
    // COMPONENT: USER SAVED MODAL
    // ==========================================

    function UserSavedModal({ isOpen, onClose, proposals, bookings, onClearAll }) {
      const [activeTab, setActiveTab] = useState('proposals');

      if (!isOpen) return null;

      return (
        <div className="fixed inset-0 z-50 bg-[#0a0e17]/85 backdrop-blur-xl flex items-center justify-center p-4 animate-fadeIn">
          <div className="bg-surface-container-low border border-outline-variant/40 rounded-2xl max-w-2xl w-full p-6 shadow-2xl flex flex-col gap-5 max-h-[85vh] overflow-hidden">
            <div className="flex items-center justify-between pb-3 border-b border-surface-container-high">
              <div className="flex items-center gap-2.5">
                <span className="material-symbols-outlined text-primary-container text-[24px]">dataset</span>
                <div>
                  <h3 className="font-headline text-lg text-primary font-bold">
                    Your Local Session Activity
                  </h3>
                  <p className="font-sans text-xs text-on-surface-variant">
                    Captured proposals, estimate matrices, and booked strategy sessions.
                  </p>
                </div>
              </div>
              <button
                onClick={onClose}
                className="w-8 h-8 rounded-lg bg-surface-container hover:bg-surface-container-high flex items-center justify-center text-on-surface-variant hover:text-on-surface transition-colors cursor-pointer"
                aria-label="Close Activity Modal"
              >
                <span className="material-symbols-outlined text-[20px]">close</span>
              </button>
            </div>

            <div className="flex items-center gap-2">
              <button
                type="button"
                onClick={() => setActiveTab('proposals')}
                className={`px-4 py-2 rounded-lg text-xs font-semibold transition-all cursor-pointer ${
                  activeTab === 'proposals'
                    ? 'bg-primary-container text-on-primary-container font-bold shadow'
                    : 'bg-surface-container text-on-surface-variant hover:text-on-surface'
                }`}
              >
                Locked Estimates ({proposals.length})
              </button>
              <button
                type="button"
                onClick={() => setActiveTab('bookings')}
                className={`px-4 py-2 rounded-lg text-xs font-semibold transition-all cursor-pointer ${
                  activeTab === 'bookings'
                    ? 'bg-primary-container text-on-primary-container font-bold shadow'
                    : 'bg-surface-container text-on-surface-variant hover:text-on-surface'
                }`}
              >
                Booked Calls ({bookings.length})
              </button>
            </div>

            <div className="flex-1 overflow-y-auto flex flex-col gap-3 pr-1">
              {activeTab === 'proposals' && (
                <>
                  {proposals.length === 0 ? (
                    <div className="p-8 text-center flex flex-col items-center justify-center gap-2 bg-surface-container rounded-xl border border-outline-variant/20">
                      <span className="material-symbols-outlined text-outline text-[32px]">calculate</span>
                      <p className="font-sans text-sm text-on-surface-variant">No locked estimates yet.</p>
                      <p className="font-sans text-xs text-outline">
                        Configure your stack in the AI Cost Estimator and submit the proposal form to save a quote here.
                      </p>
                    </div>
                  ) : (
                    proposals.map((prop) => (
                      <div
                        key={prop.id}
                        className="p-4 rounded-xl bg-surface-container border border-outline-variant/30 flex flex-col gap-2.5"
                      >
                        <div className="flex items-start justify-between">
                          <div>
                            <span className="font-sans text-xs text-primary-fixed uppercase font-bold">
                              {prop.company}
                            </span>
                            <h4 className="font-title text-base text-primary font-bold">
                              {prop.calculationResult.scopeLabel}
                            </h4>
                          </div>
                          <span className="font-headline text-base text-primary-container font-extrabold">
                            {prop.calculationResult.formattedMinCost} – {prop.calculationResult.formattedMaxCost}
                          </span>
                        </div>

                        <div className="grid grid-cols-2 gap-2 text-xs font-mono text-on-surface-variant bg-surface-container-low p-2.5 rounded">
                          <div><span className="text-outline block">Data:</span> {prop.calculationResult.dataLabel}</div>
                          <div><span className="text-outline block">Deploy:</span> {prop.calculationResult.deployLabel}</div>
                          <div><span className="text-outline block">Timeline:</span> {prop.calculationResult.timelineLabel}</div>
                          <div><span className="text-outline block">Pace:</span> {prop.calculationResult.velocityLabel}</div>
                        </div>

                        <div className="flex items-center justify-between text-xs text-outline pt-1">
                          <span>Recipient: {prop.email}</span>
                          <span>{prop.submittedAt}</span>
                        </div>
                      </div>
                    ))
                  )}
                </>
              )}

              {activeTab === 'bookings' && (
                <>
                  {bookings.length === 0 ? (
                    <div className="p-8 text-center flex flex-col items-center justify-center gap-2 bg-surface-container rounded-xl border border-outline-variant/20">
                      <span className="material-symbols-outlined text-outline text-[32px]">calendar_month</span>
                      <p className="font-sans text-sm text-on-surface-variant">No strategy sessions booked yet.</p>
                      <p className="font-sans text-xs text-outline">
                        Schedule a 30-minute discovery call with Alex Vance in the Contact tab.
                      </p>
                    </div>
                  ) : (
                    bookings.map((call) => (
                      <div
                        key={call.id}
                        className="p-4 rounded-xl bg-surface-container border border-outline-variant/30 flex flex-col gap-2.5"
                      >
                        <div className="flex items-start justify-between">
                          <div>
                            <span className="font-sans text-xs text-secondary uppercase font-bold">
                              {call.companyOrg}
                            </span>
                            <h4 className="font-title text-base text-primary font-bold">{call.fullName}</h4>
                          </div>
                          <div className="flex items-center gap-1.5 px-2.5 py-1 rounded-full bg-primary-container/20 text-primary-container text-xs font-mono font-bold">
                            <span className="material-symbols-outlined text-sm">schedule</span>
                            <span>{call.selectedTime} {call.selectedTimezone}</span>
                          </div>
                        </div>

                        <p className="font-sans text-xs text-on-surface-variant">
                          <strong>Date:</strong> {call.selectedDate} &bull; <strong>Scope:</strong> {call.projectType} &bull; <strong>Budget:</strong> {call.budgetTier}
                        </p>

                        <div className="p-2 rounded bg-surface-container-low text-xs text-on-surface-variant italic">
                          &ldquo;{call.projectDetails}&rdquo;
                        </div>

                        <div className="flex items-center justify-between text-xs text-outline pt-1">
                          <span className="flex items-center gap-1 text-primary-container">
                            <span className="material-symbols-outlined text-xs">verified</span>
                            Delaware Mutual NDA Signed
                          </span>
                          <span>Booked {call.bookedAt}</span>
                        </div>
                      </div>
                    ))
                  )}
                </>
              )}
            </div>

            <div className="flex items-center justify-between pt-3 border-t border-surface-container-high">
              {(proposals.length > 0 || bookings.length > 0) ? (
                <button
                  onClick={onClearAll}
                  className="text-xs text-error hover:underline cursor-pointer"
                >
                  Clear Session Activity
                </button>
              ) : (
                <div></div>
              )}
              <button
                onClick={onClose}
                className="px-4 py-2 rounded-lg bg-surface-container hover:bg-surface-container-high text-on-surface text-xs font-semibold cursor-pointer"
              >
                Close
              </button>
            </div>
          </div>
        </div>
      );
    }

    // ==========================================
    // ROOT APP
    // ==========================================

    function App() {
      const [currentPage, setCurrentPage] = useState('overview');
      const [reelModalOpen, setReelModalOpen] = useState(false);
      const [savedModalOpen, setSavedModalOpen] = useState(false);
      const [preselectedScope, setPreselectedScope] = useState('custom_ai');

      const [proposals, setProposals] = useState(() => {
        try {
          const stored = localStorage.getItem('neoz_proposals');
          return stored ? JSON.parse(stored) : [];
        } catch {
          return [];
        }
      });

      const [bookings, setBookings] = useState(() => {
        try {
          const stored = localStorage.getItem('neoz_bookings');
          return stored ? JSON.parse(stored) : [];
        } catch {
          return [];
        }
      });

      useEffect(() => {
        const handleHashChange = () => {
          const hash = window.location.hash.replace('#', '');
          if (['overview', 'services', 'case-studies', 'ai-cost-estimator', 'contact'].includes(hash)) {
            setCurrentPage(hash);
          }
        };

        handleHashChange();
        window.addEventListener('hashchange', handleHashChange);
        return () => window.removeEventListener('hashchange', handleHashChange);
      }, []);

      const navigateTo = (page) => {
        setCurrentPage(page);
        window.location.hash = page;
        window.scrollTo({ top: 0, behavior: 'smooth' });
      };

      const handleProposalSubmitted = (newProposal) => {
        const updated = [newProposal, ...proposals];
        setProposals(updated);
        try {
          localStorage.setItem('neoz_proposals', JSON.stringify(updated));
        } catch {
          // fallback
        }
      };

      const handleBookingSubmitted = (newBooking) => {
        const updated = [newBooking, ...bookings];
        setBookings(updated);
        try {
          localStorage.setItem('neoz_bookings', JSON.stringify(updated));
        } catch {
          // fallback
        }
      };

      const handleClearAllActivity = () => {
        setProposals([]);
        setBookings([]);
        try {
          localStorage.removeItem('neoz_proposals');
          localStorage.removeItem('neoz_bookings');
        } catch {
          // fallback
        }
      };

      const totalSavedCount = proposals.length + bookings.length;

      return (
        <div className="min-h-screen bg-[#0f131c] text-[#dfe2ef] flex flex-col font-sans selection:bg-[#00f0ff] selection:text-[#006970]">
          <Header
            currentPage={currentPage}
            onNavigate={navigateTo}
            savedCount={totalSavedCount}
            onOpenSavedModal={() => setSavedModalOpen(true)}
          />

          <main className="w-full pt-20 flex-1 flex flex-col">
            {currentPage === 'overview' && (
              <OverviewView
                onNavigate={navigateTo}
                onOpenReel={() => setReelModalOpen(true)}
              />
            )}

            {currentPage === 'services' && (
              <ServicesView
                onNavigate={navigateTo}
                onSelectServiceForEstimate={(scopeKey) => setPreselectedScope(scopeKey)}
              />
            )}

            {currentPage === 'case-studies' && (
              <CaseStudiesView onNavigate={navigateTo} />
            )}

            {currentPage === 'ai-cost-estimator' && (
              <EstimatorView
                initialScope={preselectedScope}
                onProposalSubmitted={handleProposalSubmitted}
                onNavigate={navigateTo}
              />
            )}

            {currentPage === 'contact' && (
              <ContactView onBookingSubmitted={handleBookingSubmitted} />
            )}
          </main>

          <Footer onNavigate={navigateTo} />

          <ReelModal
            isOpen={reelModalOpen}
            onClose={() => setReelModalOpen(false)}
          />

          <UserSavedModal
            isOpen={savedModalOpen}
            onClose={() => setSavedModalOpen(false)}
            proposals={proposals}
            bookings={bookings}
            onClearAll={handleClearAllActivity}
          />
        </div>
      );
    }

    // Mount to DOM
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
